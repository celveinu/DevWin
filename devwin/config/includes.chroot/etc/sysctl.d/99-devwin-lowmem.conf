# Tuned for low-RAM machines with zram swap
vm.swappiness = 150
vm.vfs_cache_pressure = 80
vm.page-cluster = 0
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# Developer needs: IDEs and file watchers on large projects (VS Code, webpack, Android Studio)
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 512
